<script>
(function () {
  const D = JSON.parse(document.getElementById('cockpit-daten').textContent);
  const MERK = 'voltaik-cockpit-schluessel';
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = u => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
  // Auftrag 457: erst nach „load“ ersetzen. Mit gemerktem Schlüssel war die Entschlüsselung schneller als das Laden;
  // document.open() wirkte dann nicht, das Login-Formular blieb links neben dem Cockpit stehen (auth-probe-vorher.png).
  const geladen = () => new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', () => r(), {once: true}));
  async function oeffnen(roh) {
    const key = await crypto.subtle.importKey('raw', roh, 'AES-GCM', false, ['decrypt']);
    for (const t of D.teile) {
      let klar;
      try { klar = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(t.iv)}, key, b(t.ct)); } catch (e) { continue; /* nächste Fassung */ }
      await geladen();
      document.open(); document.write(new TextDecoder().decode(klar)); document.close();
      return true;
    }
    return false;
  }
  async function ableiten(pw) {
    const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt: b(D.salz), iterations: D.iter}, basis, 256);
  }
  // Auftrag 820: nach dem Pflichtwechsel legt die Seite den Schlüssel des neuen Passworts unter MERK + '-neu' ab.
  // Öffnet er (erster Bau nach dem Wechsel), wird er der gemerkte Schlüssel — kein zweites Eintippen.
  const NEU = MERK + '-neu';
  async function neuProbieren() {
    const n = JSON.parse(localStorage.getItem(NEU) || 'null');
    if (!n || n.salz !== D.salz || !(await oeffnen(b(n.k)))) return false;
    localStorage.removeItem(NEU);
    if (n.merken) localStorage.setItem(MERK, JSON.stringify({k: n.k, salz: D.salz, bis: Date.now() + 30 * 864e5}));
    return true;
  }
  try {
    const m = JSON.parse(localStorage.getItem(MERK) || 'null');
    const zeigen = () => document.documentElement.classList.remove('gemerkt');
    if (m && m.bis > Date.now() && m.salz === D.salz) {
      // gemerkt: Formular bleibt aus (Kopf-Skript); passt der Schlüssel nicht mehr, kommt es zurück
      oeffnen(b(m.k)).then(async ok => {
        if (ok) return;
        localStorage.removeItem(MERK);
        if (!(await neuProbieren().catch(() => false))) zeigen();
      }, zeigen);
    } else neuProbieren().then(ok => { if (!ok) zeigen(); }, zeigen);
  } catch (e) { document.documentElement.classList.remove('gemerkt'); /* ohne Speicher: Passwort eingeben */ }
  document.getElementById('cockpit-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = document.getElementById('cockpit-fehler'); f.textContent = 'prüfe …';
    const roh = await ableiten(document.getElementById('cockpit-passwort').value);
    const merken = document.getElementById('cockpit-merken').checked;
    try { if (merken) localStorage.setItem(MERK, JSON.stringify({k: b64(roh), salz: D.salz, bis: Date.now() + 30 * 864e5})); } catch (e) {}
    if (!(await oeffnen(roh))) { f.textContent = 'Passwort passt nicht.'; try { localStorage.removeItem(MERK); } catch (e) {} }
  });
})();
</script>
